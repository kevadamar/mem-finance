name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Check, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Static public values must exist while SvelteKit generates typed modules.
      # These placeholders are only for compilation; deployment uses its own env.
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
