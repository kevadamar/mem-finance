<!doctype html>
<html lang="id" class="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0f766e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="MemFinance" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="icon" href="%sveltekit.assets%/icon-192.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
		%sveltekit.head%
		<script>
			(function() {
				try {
					var stored = localStorage.getItem('memfinance_theme') || localStorage.getItem('memfinance_dark_mode');
					var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var isDark = false;
					if (stored === 'dark' || stored === 'true') {
						isDark = true;
					} else if (stored === 'light' || stored === 'false') {
						isDark = false;
					} else {
						isDark = prefersDark;
					}
					var cl = document.documentElement.classList;
					if (isDark) {
						cl.add('dark');
						cl.remove('light');
						document.documentElement.style.colorScheme = 'dark';
					} else {
						cl.add('light');
						cl.remove('dark');
						document.documentElement.style.colorScheme = 'light';
					}
				} catch (e) {}
			})();
		</script>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch((err) => {
						console.warn('SW registration failed:', err);
					});
				});
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
